# Six sectors, as in the manager's N-CSR sector table (Currencies, Interest Rates, Equity Indices,
# Ag Commodities, Metals, Energy). Free Yahoo continuous front-month futures (^ = cash-index proxy).
# cost_bp: one-way cost in bp of notional = (half a tick + $2 commission) / contract notional at
# 2024 prices, x1.5 for slippage (x2-3 for thin contracts). Derivation in research/costs.md.
# rolls: contract rolls per year; each roll is charged as two one-way trades.
sectors:
  equity: {rolls: 4,  tickers: {ES=F: 0.5, NQ=F: 0.3, YM=F: 0.35, NKD=F: 1.1, ^STOXX50E: 2.0, ^FTSE: 0.85}}
  # rates and fx: carry-correct synthetic excess returns from FRED (src/trend/macro.py, EXP-003),
  # charged the cost of the equivalent CME future (ZT/ZF/ZN/ZB; 6E/6J/6B/6A/6C/6S/6N/6M).
  rates:  {rolls: 4,  tickers: {UST2: 0.45, UST5: 0.8, UST10: 1.3, UST20: 2.3}}
  fx:     {rolls: 4,  tickers: {EUR: 0.6, JPY: 0.9, GBP: 1.0, AUD: 1.0, CAD: 0.9, CHF: 0.6, NZD: 1.1, MXN: 2.5}}
  metals: {rolls: 6,  tickers: {GC=F: 0.5, SI=F: 1.6, HG=F: 1.2, PL=F: 2.0, PA=F: 5.0}}
  energy: {rolls: 12, tickers: {CL=F: 1.4, BZ=F: 1.4, NG=F: 3.5, HO=F: 1.5, RB=F: 1.5}}
  ags:    {rolls: 5,  tickers: {ZC=F: 5.5, ZW=F: 4.3, ZS=F: 2.1, ZM=F: 3.0, ZL=F: 2.8, KC=F: 3.0, SB=F: 5.0, CT=F: 2.5, CC=F: 4.0, LE=F: 2.5, HE=F: 3.0}}
benchmarks: [EBSIX, AQMIX, ASFYX, DBMF, KMLM, SPY, AGG]
