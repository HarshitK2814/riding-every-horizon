name: forward-tracking
on:
  schedule: [{cron: "30 23 * * 1-5"}]   # after US close, weekdays
  workflow_dispatch: {}
permissions: {contents: write}
concurrency: {group: forward-tracking, cancel-in-progress: false}
jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e qcore -e qengine -e ".[v3]"
      - name: Cache TimesFM weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-google-timesfm-2.5-200m-pytorch-timesfm3.0.2
      - run: python scripts/v2/forward.py --refresh
      - run: python scripts/v3/forward.py --refresh-signals
      # site export step is added in Task 9 (scripts/v3/export_site_data.py --forward-only)
      - name: Commit
        run: |
          git config user.name "forward-bot"
          git config user.email "forward-bot@users.noreply.github.com"
          git add results/v2/forward results/v3/forward results/v3/cache
          git diff --cached --quiet || git commit -m "forward: $(date -u +%F)"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
