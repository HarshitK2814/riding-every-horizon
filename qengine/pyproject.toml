[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qengine"
version = "0.1.0"
description = "Lean, transparent backtest engine: costs, impact, integer contracts, walk-forward, Monte Carlo, capacity, tearsheets."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "matplotlib>=3.8", "pyyaml>=6", "qcore"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qengine = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
